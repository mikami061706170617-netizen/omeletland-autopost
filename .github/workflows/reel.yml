name: reel post

on:
  schedule:
    - cron: "0 16 * * 1,3,5"   # 16:00 UTC = 20:00 トビリシ（月・水・金）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せずに中身だけ表示する"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: post reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          IG_LOCATION_ID: ${{ secrets.IG_LOCATION_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 post_reel.py

      - name: record
        if: ${{ success() && inputs.dry_run != true }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "reel posted $(date -u +%F)"
            git push
          fi
