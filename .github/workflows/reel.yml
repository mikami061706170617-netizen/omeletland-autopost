name: reel post

on:
  schedule:
    # GitHub は「ちょうど○時」が混んで数時間遅れるので、半端な分にする。2本目は1本目が来なかったときの予備
    #（同じ日に2本は出さない）
    - cron: "37 15 * * *"      # 15:37 UTC = 19:37 トビリシ（毎日）
    - cron: "41 17 * * *"      # 17:41 UTC = 21:41 トビリシ（予備）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せずに中身だけ表示する"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: post reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          # 場所タグ: 店の Facebook ページ（住所 1 Davit Gamrekeli St＝Japan Food Hub が入っている）を使う
          IG_LOCATION_ID: ${{ secrets.IG_LOCATION_ID || secrets.FB_PAGE_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 post_reel.py

      - name: record
        if: ${{ success() && inputs.dry_run != true }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "reel posted $(date -u +%F)"
            git push
          fi
