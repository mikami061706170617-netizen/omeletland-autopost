name: youtube post

# 毎日 11:00 UTC（日本 20:00 / トビリシ 15:00）に Shorts を1本、日曜はロングも1本。
# 今は notify モード: Issue で「今日の動画・タイトル・説明」を知らせ、スマホから手で投稿する。
# API 審査に通ったら、リポジトリの Variables に YT_MODE=auto を入れると自動アップロードに変わる。
on:
  # 時刻どおりに動かすため、外の予定タスクが決まった時刻に kick/youtube ブランチへ空コミットを push して起動する。
  # schedule は予備（GitHub の都合で数時間遅れる）。同じ枠は二重に出さない仕組みがスクリプト側にある。
  push:
    branches: [kick/youtube]
  schedule:
    - cron: "13 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せずに中身だけ表示する"
        type: boolean
        default: false
      force_long:
        description: "曜日に関係なくロングも出す"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: state-json
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # kick ブランチから起動しても、コードと記録は main のもの

      - name: post
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YT_MODE: ${{ vars.YT_MODE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || contains(github.event.head_commit.message, 'dry_run') }}
          FORCE_LONG: ${{ inputs.force_long }}
        run: python3 post_youtube.py

      - name: record
        if: ${{ success() && inputs.dry_run != true && !contains(github.event.head_commit.message, 'dry_run') }}
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "youtube $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
